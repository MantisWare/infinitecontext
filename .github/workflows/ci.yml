name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  POSTGRES_USER: infinitecontext
  POSTGRES_PASSWORD: ic-ci-test-postgres-password
  PGHOST: 127.0.0.1
  PGPORT: 5432
  SYNC_E2E_DATABASE_URL: postgresql://infinitecontext:ic-ci-test-postgres-password@127.0.0.1:5432/infinitecontext_sync_e2e
  VAULT_E2E_DATABASE_URL: postgresql://infinitecontext:ic-ci-test-postgres-password@127.0.0.1:5432/infinitecontext_sync_e2e

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm -r check
        run: pnpm -r check

  test:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: infinitecontext
          POSTGRES_PASSWORD: ic-ci-test-postgres-password
          POSTGRES_DB: infinitecontext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinitecontext -d infinitecontext"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: pnpm install --frozen-lockfile

      - name: Prepare E2E database schema
        run: |
          export PGPASSWORD="${POSTGRES_PASSWORD}"
          psql -h "${PGHOST}" -p "${PGPORT}" -U "${POSTGRES_USER}" -d infinitecontext -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE infinitecontext_sync_e2e OWNER ${POSTGRES_USER};" \
            || true
          PSQL=(psql -h "${PGHOST}" -p "${PGPORT}" -U "${POSTGRES_USER}" -d infinitecontext_sync_e2e -v ON_ERROR_STOP=1)
          "${PSQL[@]}" < apps/postgres/init.sql
          for migration_file in apps/postgres/migrations/*.sql; do
            case "$(basename "$migration_file")" in
              *.down.sql) continue ;;
            esac
            "${PSQL[@]}" < "$migration_file"
          done

      - name: pnpm -r test (serial)
        run: pnpm -r test --workspace-concurrency=1
