name: Storage (Phase 4.5)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      INFINITECONTEXT_S3_TEST_BUCKET: infinitecontext-ci
      INFINITECONTEXT_S3_TEST_PREFIX: storage-ci
      IC_REQUIRE_MINIO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build pinned MinIO server from source
        env:
          MINIO_GIT_TAG: RELEASE.2024-11-07T00-52-20Z
        run: |
          git clone --depth 1 --branch "$MINIO_GIT_TAG" https://github.com/minio/minio.git /tmp/minio-src
          cd /tmp/minio-src
          go build -trimpath -ldflags="-s -w" -o /tmp/minio .
          /tmp/minio --version | tee /tmp/minio-version.txt

      - name: Start MinIO (S3-compatible)
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO ready (built from ${MINIO_GIT_TAG:-RELEASE.2024-11-07T00-52-20Z})"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to start"
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Syntax check storage modules
        run: |
          node --check apps/js-sdk/lib/storage/ciphertext.mjs
          node --check apps/js-sdk/lib/storage/types.mjs
          node --check apps/js-sdk/lib/storage/errors.mjs
          node --check apps/js-sdk/lib/storage/memory-adapter.mjs
          node --check apps/js-sdk/lib/storage/filesystem-adapter.mjs
          node --check apps/js-sdk/lib/storage/filesystem-keys.mjs
          node --check apps/js-sdk/lib/storage/filesystem-paths.mjs
          node --check apps/js-sdk/lib/storage/filesystem-object-file.mjs
          node --check apps/js-sdk/lib/storage/filesystem-generations.mjs
          node --check apps/js-sdk/lib/storage/local-object-store.mjs
          node --check apps/js-sdk/lib/storage/layout.mjs
          node --check apps/js-sdk/lib/storage/storage-object-move.mjs
          node --check apps/js-sdk/lib/storage/contract-suite.mjs
          node --check apps/js-sdk/lib/storage/encrypt-storage-object.mjs
          node --check apps/js-sdk/lib/object-store-sync.mjs
          node --check apps/js-sdk/lib/sync-cursor.mjs
          node --check apps/js-sdk/lib/storage/object-store-sync-transport.mjs
          node --check apps/js-sdk/lib/storage/secret-store-constants.mjs
          node --check apps/js-sdk/lib/storage/secret-store-private-dir.mjs
          node --check apps/js-sdk/lib/storage/secret-store-heartbeat-lock.mjs
          node --check apps/js-sdk/lib/storage/secret-store-file-link.mjs
          node --check apps/js-sdk/lib/storage/secret-store-file-generations.mjs
          node --check apps/js-sdk/lib/storage/secret-store-linux-dbus.mjs
          node --check apps/js-sdk/lib/storage/secret-store-keyring-probe-child.mjs
          node --check apps/js-sdk/lib/storage/secret-store-keyring-probe.mjs
          node --check apps/js-sdk/lib/storage/secret-store-marker.mjs
          node --check apps/js-sdk/lib/storage/secret-store-keyring.mjs
          node --check apps/js-sdk/lib/storage/secret-store-file.mjs
          node --check apps/js-sdk/lib/storage/secret-store.mjs
          node --check apps/js-sdk/lib/storage/index.mjs
          node --check apps/js-sdk/lib/storage/s3-config.mjs
          node --check apps/js-sdk/lib/storage/s3-cas-probe.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-probe.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-cache.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-endpoint.mjs
          node --check apps/js-sdk/lib/storage/storage-s3-cas-probe-session.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-init.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-probe-sweep.mjs
          node --check apps/js-sdk/lib/storage/storage-cas-race-probe.mjs
          node --check apps/js-sdk/lib/storage/storage-doctor-cas.mjs
          node --check apps/js-sdk/lib/storage/storage-migrate-dest-path-guard.mjs
          node --check apps/js-sdk/lib/storage/storage-put-preconditions.mjs
          node --check apps/js-sdk/lib/storage/s3-adapter.mjs
          node --check apps/js-sdk/lib/storage/s3-object-store.mjs

      - name: Storage adapter contract tests
        working-directory: apps/js-sdk
        run: node --test --test-concurrency=1 tests/storage/*.test.mjs

      - name: Storage doctor CAS race (MinIO)
        working-directory: apps/js-sdk
        run: node --test --test-concurrency=1 tests/storage/storage-doctor-cas-minio.test.mjs 2>&1 | tee /tmp/ic-doctor-cas.log && grep -q "IC_DOCTOR_CAS_RACE:" /tmp/ic-doctor-cas.log

      - name: Secret store keyring (Secret Service via dbus-run-session)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-x11 gnome-keyring
          dbus-run-session -- bash -ec '
            cleanup() {
              killall gcr-prompter 2>/dev/null || true
            }
            trap cleanup EXIT
            eval "$(echo -n "ci-pass" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null || true)"
            export IC_REQUIRE_SECRET_SERVICE=1
            export INFINITECONTEXT_SECRET_STORE=keyring
            node --test --test-concurrency=1 apps/js-sdk/tests/storage/secret-store-keyring-ci.test.mjs 2>&1 | tee /tmp/ic-keyring-ci.log
            grep -q "IC_SECRET_SERVICE_CI: passed" /tmp/ic-keyring-ci.log
            if grep -q "# SKIP" /tmp/ic-keyring-ci.log; then
              echo "Keyring CI test skipped but IC_REQUIRE_SECRET_SERVICE=1"
              exit 1
            fi
          '
