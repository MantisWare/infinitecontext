name: Storage (Phase 4.5)

on:
  pull_request:
    paths:
      - "apps/js-sdk/lib/storage/**"
      - "apps/js-sdk/tests/storage/**"
      - "scripts/storage-issue12-guard.sh"
      - ".github/workflows/storage.yml"
  push:
    branches:
      - main
    paths:
      - "apps/js-sdk/lib/storage/**"
      - "apps/js-sdk/tests/storage/**"
      - "scripts/storage-issue12-guard.sh"
      - ".github/workflows/storage.yml"

jobs:
  issue12-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block overlap with issue #12 paths
        run: bash scripts/storage-issue12-guard.sh
        env:
          STORAGE_GUARD_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Syntax check storage modules
        run: |
          node --check apps/js-sdk/lib/storage/ciphertext.mjs
          node --check apps/js-sdk/lib/storage/types.mjs
          node --check apps/js-sdk/lib/storage/memory-adapter.mjs
          node --check apps/js-sdk/lib/storage/contract-suite.mjs
          node --check apps/js-sdk/lib/storage/index.mjs

      - name: Storage adapter contract tests
        run: node --test --test-concurrency=1 apps/js-sdk/tests/storage/*.test.mjs
